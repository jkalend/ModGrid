name: check

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real-runtime:
        description: Run the explicitly authorized disposable Minecraft fixture
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
      - run: go mod verify
      - run: go vet ./...
      - run: go test -count=1 '-coverprofile=coverage.out' ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - run: go build -o bin/ ./cmd/modgrid
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          retention-days: 14

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: go test ./internal/resolver -run '^$' -fuzz '^FuzzResolve$' -fuzztime 20s -parallel 2
      - run: go test ./internal/resolver -run '^$' -fuzz '^FuzzStrictJSON$' -fuzztime 20s -parallel 2

  real-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.real-runtime && vars.MODGRID_TEST_EULA == 'true'
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Prepare exact disposable runtime under owner EULA authorization
        shell: pwsh
        run: ./scripts/prepare-runtime.ps1 -Root out/runtime -AcceptEula
      - name: Real server, clean stop, verified checkpoint, scratch restore and saved-world oracle
        run: go test ./internal/server -run '^TestRealFabricCheckpointRestore$' -count=1 -v -timeout 8m
